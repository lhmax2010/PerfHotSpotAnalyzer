notes: |
  Hotfix effective anchor handoff is implemented on
  stage/hotfix-effective-anchor-handoff from the realboard analyze correctness
  branch. It fixes the A to B handoff by persisting derived effective anchors
  in A reports and making B prefer serialized anchors for ingest and
  chosen_anchor output.

  Hotfix realboard analyze correctness is implemented on
  stage/hotfix-realboard-analyze-correctness from the ctags performance hotfix
  branch. It codifies the manually verified Tizen armv7l + ffmpeg analyze fixes:
  invalid-symbol guards, miss caching, pattern-only ctags real line lookup,
  versioned DSO ownership matching, and owned hotspot retention under system
  noise.

  Hotfix ctags index performance is implemented on
  stage/hotfix-ctags-index-perf from the Tizen real-board hotfix branch. It
  fixes ctags lookup so large tags files do not trigger per-entry source scans
  during analyze.

  Hotfix Tizen real-board is implemented on stage/hotfix-tizen-realboard from
  the v1 complete integration branch. It fixes the eight ssh/Tizen/ffmpeg live
  profiling issues discovered on armv7l hardware without changing the v1
  architecture.

  M-integ is implemented on stage/minteg-integration from the M-final branch.
  Cline CLI/rules examples, a Compiling Agent CLI adapter draft, and the v1
  integration guide are complete. This is the final v1 milestone.

  M-final is implemented on stage/mfinal-workflow from the A3 branch. The
  non-triggerable workflow supports full, b-only, and a-only modes; two human
  gates; non-interactive review-package-only operation; stage resume; CLI
  integration; and merged reports.

  A3 is implemented on stage/a3-tizen-symbolize from the A2 branch. ssh/sdb
  DeviceRunner backends, remote Tizen capture flow, host-side build-id/sysroot
  cross-symbolization, tizen.path_mapping output, offline Tizen-style fixture,
  and live-device guide are complete.

  A1 is implemented on stage/a1-x86-perf from the B3 branch. Local x86 perf
  capture/analyze/report, ownership, caller-attribution, and pre-captured CI
  fixture coverage are complete.

  A2 is implemented on stage/a2-binary-size from the A1 branch. Static ELF
  binary-size-large and binary-size-regression analysis, CLI integration, real
  ELF fixtures, and size -A cross-checks are complete.

  B3 is implemented on stage/b3-patch-gen from the B2 branch. Patch generation,
  full Gate status selection, files_touched_policy, and patch-report.md are
  covered.

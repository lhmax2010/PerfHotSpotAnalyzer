notes: |
  M-final is implemented on stage/mfinal-workflow from the A3 branch. The
  non-triggerable workflow supports full, b-only, and a-only modes; two human
  gates; non-interactive review-package-only operation; stage resume; CLI
  integration; and merged reports.

  A3 is implemented on stage/a3-tizen-symbolize from the A2 branch. ssh/sdb
  DeviceRunner backends, remote Tizen capture flow, host-side build-id/sysroot
  cross-symbolization, tizen.path_mapping output, offline Tizen-style fixture,
  and live-device guide are complete.

  A1 is implemented on stage/a1-x86-perf from the B3 branch. Local x86 perf
  capture/analyze/report, ownership, caller-attribution, and pre-captured CI
  fixture coverage are complete.

  A2 is implemented on stage/a2-binary-size from the A1 branch. Static ELF
  binary-size-large and binary-size-regression analysis, CLI integration, real
  ELF fixtures, and size -A cross-checks are complete.

  B3 is implemented on stage/b3-patch-gen from the B2 branch. Patch generation,
  full Gate status selection, files_touched_policy, and patch-report.md are
  covered.

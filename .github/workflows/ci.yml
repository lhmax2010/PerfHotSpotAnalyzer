name: ci

on:
  pull_request:
  push:
    branches: [main, "stage/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Check production code has no LLM SDK imports
        run: bash tools/check_no_llm_sdk_imports.sh
      - name: Check canonical schema copies
        run: python tools/check_schema_copies.py
      - name: Run unit tests
        run: python -m pytest tests/unit
      - name: Run golden fixture tests
        run: python -m pytest tests/functional tests/security
